name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    # این بخش برای حل خطای 128 (دسترسی نوشتن) اضافه شده است
    permissions:
      contents: write 

    steps:
      # نسخه‌ها به v4 ارتقا یافتند تا هشدار Node.js برطرف شود
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        with:
          github_user_name: AliJohari05
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
